<!DOCTYPE html>
<html>
<head>
  <title>CRM Login</title>
</head>
<body>

<h2>Login</h2>
<button id="loginBtn">Login with Google</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyA7gt9nQeW6XXADCCoMLaKPWS6Z3YcF-ls",
  authDomain: "rolecrm-dc37a.firebaseapp.com",
  projectId: "rolecrm-dc37a",
  storageBucket: "rolecrm-dc37a.firebasestorage.app",
  messagingSenderId: "273390543342",
  appId: "1:273390543342:web:2d9d677a3b58f15d26aeff",
  measurementId: "G-FE1N5RJ8PK"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

// AUTO REDIRECT IF ALREADY LOGGED IN
onAuthStateChanged(auth, async (user) => {
  if (user) {
    const snap = await getDoc(doc(db,"users",user.uid));
    if (!snap.exists()) return;

    const role = snap.data().role;

    if(role==="cleaner") location.href="1.html";
    else if(role==="info") location.href="2.html";
    else if(role==="final") location.href="3.html";
    else if(role==="admin") location.href="admin.html";
  }
});

document.getElementById("loginBtn").onclick = async ()=>{
  await signInWithPopup(auth, provider);
};

</script>

</body>
</html>
