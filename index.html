<!DOCTYPE html>
<html>
<head>
  <title>Education CRM Login</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg,#667eea,#764ba2);
      font-family: Arial, sans-serif;
    }

    .login-box {
      background: white;
      padding: 40px;
      width: 350px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.3s;
      color: white;
      background: #4e73df;
    }

    button:hover {
      opacity: 0.9;
    }

    .small {
      font-size: 12px;
      margin-top: 15px;
      color: gray;
    }
  </style>
</head>

<body>

<div class="login-box">
  <h2>Education CRM</h2>
  <button id="loginBtn">Login with Google</button>
  <div class="small">Secure Role Based Access</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyA7gt9nQeW6XXADCCoMLaKPWS6Z3YcF-ls",
  authDomain: "rolecrm-dc37a.firebaseapp.com",
  projectId: "rolecrm-dc37a",
  storageBucket: "rolecrm-dc37a.firebasestorage.app",
  messagingSenderId: "273390543342",
  appId: "1:273390543342:web:2d9d677a3b58f15d26aeff",
  measurementId: "G-FE1N5RJ8PK"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();


// 🔥 AUTO REDIRECT IF ALREADY LOGGED IN
onAuthStateChanged(auth, async (user) => {
  if (user) {
    await handleUser(user);
  }
});


// 🔥 LOGIN BUTTON
document.getElementById("loginBtn").onclick = async () => {
  const result = await signInWithPopup(auth, provider);
  const user = result.user;
  await handleUser(user);
};


// 🔥 HANDLE USER CREATION + REDIRECT
async function handleUser(user){

  const userRef = doc(db,"users",user.uid);
  const snap = await getDoc(userRef);

  // If user does not exist → create automatically
  if (!snap.exists()) {

    await setDoc(userRef,{
      name: user.displayName,
      email: user.email,
      role: "cleaner",   // DEFAULT ROLE
      createdAt: new Date()
    });

    // Immediately go to cleaner panel
    window.location.href = "1.html";
    return;
  }

  // If exists → ALWAYS send to cleaner (as you requested)
  window.location.href = "1.html";
}

</script>

</body>
</html>
