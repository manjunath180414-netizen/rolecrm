<!DOCTYPE html>
<html>
<head>
  <title>Education CRM</title>
  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#4e73df,#1cc88a);
      font-family:Arial;
    }

    .box{
      background:white;
      padding:40px;
      width:340px;
      border-radius:15px;
      text-align:center;
      box-shadow:0 15px 40px rgba(0,0,0,0.2);
    }

    h2{margin-bottom:20px;}

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-size:14px;
      color:white;
      background:#4e73df;
      transition:0.3s;
    }

    button:hover{opacity:0.9;}

    .small{
      margin-top:15px;
      font-size:12px;
      color:gray;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Education CRM</h2>
  <button id="loginBtn">Login with Google</button>
  <div class="small">Role Based Secure System</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyA7gt9nQeW6XXADCCoMLaKPWS6Z3YcF-ls",
  authDomain: "rolecrm-dc37a.firebaseapp.com",
  projectId: "rolecrm-dc37a",
  storageBucket: "rolecrm-dc37a.firebasestorage.app",
  messagingSenderId: "273390543342",
  appId: "1:273390543342:web:2d9d677a3b58f15d26aeff",
  measurementId: "G-FE1N5RJ8PK"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();


// 🔥 AUTO CHECK IF ALREADY LOGGED IN
onAuthStateChanged(auth, async (user)=>{
  if(user){
    await handleUser(user);
  }
});


// 🔥 LOGIN BUTTON
document.getElementById("loginBtn").onclick = async ()=>{
  const result = await signInWithPopup(auth, provider);
  await handleUser(result.user);
};


// 🔥 MAIN ROLE HANDLER
async function handleUser(user){

  const userRef = doc(db,"users",user.uid);
  const snap = await getDoc(userRef);

  // 🔥 If new user → auto create as cleaner
  if(!snap.exists()){
    await setDoc(userRef,{
      name: user.displayName,
      email: user.email,
      role: "cleaner",
      createdAt: new Date()
    });

    return location.href = "1.html";
  }

  const role = snap.data().role;

  // 🔥 Redirect based on role
  if(role === "admin")
    location.href = "admin.html";

  else if(role === "cleaner")
    location.href = "1.html";

  else if(role === "info")
    location.href = "2.html";

  else if(role === "final")
    location.href = "3.html";

  else if(role === "disabled")
    location.href = "index.html";   // silently stay

  else
    location.href = "1.html";       // default fallback
}

</script>

</body>
</html>
