<!DOCTYPE html>
<html>
<head>
  <title>CRM Login</title>
  <style>
    body {
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#4e73df,#1cc88a);
      font-family:Arial;
    }

    .box {
      background:white;
      padding:40px;
      border-radius:12px;
      width:320px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    button {
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-size:14px;
      color:white;
      background:#4e73df;
    }

    button:hover {
      opacity:0.9;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Education CRM</h2>
  <button id="loginBtn">Login with Google</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyA7gt9nQeW6XXADCCoMLaKPWS6Z3YcF-ls",
  authDomain: "rolecrm-dc37a.firebaseapp.com",
  projectId: "rolecrm-dc37a",
  storageBucket: "rolecrm-dc37a.firebasestorage.app",
  messagingSenderId: "273390543342",
  appId: "1:273390543342:web:2d9d677a3b58f15d26aeff",
  measurementId: "G-FE1N5RJ8PK"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const provider = new GoogleAuthProvider();

document.getElementById("loginBtn").onclick = async () => {

  const result = await signInWithPopup(auth, provider);
  const user = result.user;

  const userRef = doc(db,"users",user.uid);
  const snap = await getDoc(userRef);

  // 🔥 If user does not exist → create automatically
  if (!snap.exists()) {

    await setDoc(userRef,{
      name: user.displayName,
      email: user.email,
      role: "cleaner",   // default role
      createdAt: new Date()
    });

    location.href = "1.html";
    return;
  }

  // 🔥 If exists → redirect based on role
  const role = snap.data().role;

  if (role === "admin")
    location.href = "admin.html";

  else if (role === "info")
    location.href = "2.html";

  else if (role === "final")
    location.href = "3.html";

  else
    location.href = "1.html"; // default cleaner
};

</script>

</body>
</html>
