<!DOCTYPE html>
<html>
<head>
  <title>Info Panel</title>
  <style>
    body { font-family: Arial; background:#eef2f7; padding:20px; }
    .card {
      background:white;
      padding:15px;
      margin-top:15px;
      border-radius:8px;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }
    input { padding:5px; margin-top:5px; }
    button { padding:6px 10px; margin:5px 3px; border:none; border-radius:5px; cursor:pointer; }
    .blue { background:#007bff; color:white; }
    .red { background:#dc3545; color:white; }
  </style>
</head>
<body>

<h2>Info Team Dashboard</h2>
<div id="userEmail"></div>
<div id="leads"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, updateDoc, doc } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyA7gt9nQeW6XXADCCoMLaKPWS6Z3YcF-ls",
  authDomain: "rolecrm-dc37a.firebaseapp.com",
  projectId: "rolecrm-dc37a",
  storageBucket: "rolecrm-dc37a.firebasestorage.app",
  messagingSenderId: "273390543342",
  appId: "1:273390543342:web:2d9d677a3b58f15d26aeff",
  measurementId: "G-FE1N5RJ8PK"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user)=>{
  if(!user) return location.href="index.html";

  document.getElementById("userEmail").innerText=user.email;

  const q = query(collection(db,"leads"), where("stage","==","info"));
  const snap = await getDocs(q);

  snap.forEach(d=>{
    const data=d.data();
    document.getElementById("leads").innerHTML+=`
      <div class="card">
        <b>${data.studentName}</b><br>
        ${data.phone}<br><br>

        Amount: <input id="amt${d.id}" type="number"><br>

        <button class="blue" onclick="move('${d.id}','whatsapp')">Interested</button>
        <button class="red" onclick="move('${d.id}','closed')">Not Interested</button>
        <button class="blue" onclick="join('${d.id}')">Joined</button>
      </div>
    `;
  });
});

window.move = async(id,stage)=>{
  await updateDoc(doc(db,"leads",id),{
    stage:stage,
    updatedAt:new Date()
  });
  location.reload();
};

window.join = async(id)=>{
  const amt = document.getElementById("amt"+id).value;
  await updateDoc(doc(db,"leads",id),{
    stage:"closed",
    amount:Number(amt),
    updatedAt:new Date()
  });
  location.reload();
};

</script>
</body>
</html>
