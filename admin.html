<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <style>
    body{margin:0;font-family:Arial;background:#f4f6f9;}
    .container{padding:20px;}
    .card{
      background:white;
      padding:20px;
      border-radius:10px;
      margin-top:20px;
      box-shadow:0 10px 25px rgba(0,0,0,0.08);
    }
    input,select{
      padding:8px;
      margin:5px;
    }
    button{
      padding:8px 12px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      background:#2563eb;
      color:white;
    }
  </style>
</head>
<body>

<div class="container">

  <h2>Admin Dashboard</h2>
  <p id="userEmail"></p>

  <!-- CSV Upload -->
  <div class="card">
    <h3>Bulk Upload CSV</h3>
    <input type="file" id="csvFile" accept=".csv"><br><br>

    Assign To:
    <select id="assignType">
      <option value="equal">Distribute Equally</option>
      <option value="specific">Assign Specific Cleaner</option>
    </select>

    <select id="cleanerSelect"></select>

    <br><br>
    <button onclick="uploadCSV()">Upload Leads</button>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, getDoc } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyA7gt9nQeW6XXADCCoMLaKPWS6Z3YcF-ls",
  authDomain: "rolecrm-dc37a.firebaseapp.com",
  projectId: "rolecrm-dc37a",
  storageBucket: "rolecrm-dc37a.firebasestorage.app",
  messagingSenderId: "273390543342",
  appId: "1:273390543342:web:2d9d677a3b58f15d26aeff",
  measurementId: "G-FE1N5RJ8PK"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let cleaners = [];
let roundRobinIndex = 0;

onAuthStateChanged(auth, async(user)=>{
  if(!user) return location.href="index.html";

  const snap = await getDoc(doc(db,"users",user.uid));
  if(!snap.exists() || snap.data().role !== "admin")
    return location.href="index.html";

  document.getElementById("userEmail").innerText=user.email;

  loadCleaners();
});

async function loadCleaners(){
  const snap = await getDocs(collection(db,"users"));
  const select = document.getElementById("cleanerSelect");
  select.innerHTML="";

  snap.forEach(d=>{
    if(d.data().role==="cleaner"){
      cleaners.push({uid:d.id,email:d.data().email});
      select.innerHTML+=`<option value="${d.id}">${d.data().email}</option>`;
    }
  });
}

window.uploadCSV = async ()=>{

  const file = document.getElementById("csvFile").files[0];
  if(!file) return alert("Upload CSV file");

  const text = await file.text();
  const rows = text.split("\n").map(r=>r.split(","));

  const headers = rows[0].map(h=>h.trim().toLowerCase());

  const nameIndex = headers.findIndex(h =>
    h.includes("name")
  );

  const phoneIndex = headers.findIndex(h =>
    h.includes("phone") || h.includes("number")
  );

  if(nameIndex === -1 || phoneIndex === -1)
    return alert("Name or Phone column not found");

  const assignType = document.getElementById("assignType").value;

  for(let i=1;i<rows.length;i++){

    const cols = rows[i];
    if(!cols[nameIndex] || !cols[phoneIndex]) continue;

    let assignedCleaner = null;

    if(assignType === "specific"){
      assignedCleaner = document.getElementById("cleanerSelect").value;
    } else {
      assignedCleaner = cleaners[roundRobinIndex % cleaners.length].uid;
      roundRobinIndex++;
    }

    await addDoc(collection(db,"leads"),{
      studentName: cols[nameIndex].trim(),
      phone: cols[phoneIndex].trim(),
      stage: "verification",
      status: "New",
      amount: 0,
      assignedCleaner: assignedCleaner,
      createdAt: new Date(),
      updatedAt: new Date()
    });
  }

  alert("Bulk Upload Completed");
};

</script>

</body>
</html>
