<!DOCTYPE html>
<html>
<head>
  <title>Cleaner Performance Dashboard</title>
  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#f4f6f9;
    }

    .container{
      padding:20px;
    }

    h2{
      margin-bottom:10px;
    }

    .cleaner-list{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:20px;
    }

    .cleaner-btn{
      padding:10px 15px;
      background:#2563eb;
      color:white;
      border:none;
      border-radius:8px;
      cursor:pointer;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:15px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0 10px 25px rgba(0,0,0,0.08);
      text-align:center;
    }

    .card h3{
      margin:5px 0;
    }

  </style>
</head>
<body>

<div class="container">

  <h2>Cleaner Performance (Live)</h2>

  <div class="cleaner-list" id="cleanerList"></div>

  <div class="stats" id="statsSection" style="display:none;">

    <div class="card">
      Assigned
      <h3 id="assigned">0</h3>
    </div>

    <div class="card">
      Verification Pending
      <h3 id="verification">0</h3>
    </div>

    <div class="card">
      Verified (Moved to Info)
      <h3 id="verified">0</h3>
    </div>

    <div class="card">
      Not Interested
      <h3 id="notInterested">0</h3>
    </div>

    <div class="card">
      Not Receiving
      <h3 id="notReceiving">0</h3>
    </div>

    <div class="card">
      Switch Off
      <h3 id="switchOff">0</h3>
    </div>

    <div class="card">
      Wrong Number
      <h3 id="wrongNumber">0</h3>
    </div>

    <div class="card">
      Call Back
      <h3 id="callBack">0</h3>
    </div>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, onSnapshot, query, where, getDocs } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyA7gt9nQeW6XXADCCoMLaKPWS6Z3YcF-ls",
  authDomain: "rolecrm-dc37a.firebaseapp.com",
  projectId: "rolecrm-dc37a",
  storageBucket: "rolecrm-dc37a.firebasestorage.app",
  messagingSenderId: "273390543342",
  appId: "1:273390543342:web:2d9d677a3b58f15d26aeff",
  measurementId: "G-FE1N5RJ8PK"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentCleaner = null;

onAuthStateChanged(auth,(user)=>{
  if(!user) return location.href="index.html";
  loadCleaners();
});

async function loadCleaners(){

  const snap = await getDocs(collection(db,"users"));
  const list = document.getElementById("cleanerList");
  list.innerHTML="";

  snap.forEach(d=>{
    if(d.data().role==="cleaner"){
      list.innerHTML+=`
        <button class="cleaner-btn"
          onclick="loadStats('${d.id}','${d.data().email}')">
          ${d.data().email}
        </button>
      `;
    }
  });
}

window.loadStats = (cleanerId,email)=>{

  currentCleaner = cleanerId;
  document.getElementById("statsSection").style.display="grid";

  const q = query(
    collection(db,"leads"),
    where("assignedCleaner","==",cleanerId)
  );

  onSnapshot(q,(snapshot)=>{

    let assigned=0;
    let verification=0;
    let verified=0;
    let notInterested=0;
    let notReceiving=0;
    let switchOff=0;
    let wrongNumber=0;
    let callBack=0;

    snapshot.forEach(doc=>{
      const data=doc.data();
      assigned++;

      if(data.stage==="verification") verification++;
      if(data.stage==="info") verified++;

      if(data.status==="not_interested") notInterested++;
      if(data.status==="not_receiving") notReceiving++;
      if(data.status==="switch_off") switchOff++;
      if(data.status==="wrong_number") wrongNumber++;
      if(data.stage==="call_back") callBack++;
    });

    document.getElementById("assigned").innerText=assigned;
    document.getElementById("verification").innerText=verification;
    document.getElementById("verified").innerText=verified;
    document.getElementById("notInterested").innerText=notInterested;
    document.getElementById("notReceiving").innerText=notReceiving;
    document.getElementById("switchOff").innerText=switchOff;
    document.getElementById("wrongNumber").innerText=wrongNumber;
    document.getElementById("callBack").innerText=callBack;

  });
};

</script>

</body>
</html>
