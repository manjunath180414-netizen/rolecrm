      <!DOCTYPE html>
<html>
<head>
  <title>Verification Dashboard</title>
  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#f4f6f9;
    }

    .container{
      max-width:900px;
      margin:30px auto;
      padding:20px;
    }

    .stats{
      display:flex;
      gap:20px;
      margin-bottom:30px;
    }

    .stat-card{
      flex:1;
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0 10px 25px rgba(0,0,0,0.08);
      text-align:center;
    }

    .lead-card{
      background:white;
      padding:30px;
      border-radius:15px;
      box-shadow:0 10px 25px rgba(0,0,0,0.1);
      text-align:center;
    }

    .lead-card h2{
      margin-bottom:10px;
    }

    .copy-btn{
      background:#2563eb;
      color:white;
      padding:10px 15px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      margin-top:10px;
    }

    select, input{
      padding:10px;
      margin-top:15px;
      width:100%;
      border-radius:8px;
      border:1px solid #ccc;
    }

    .submit-btn{
      margin-top:20px;
      background:#16a34a;
      color:white;
      padding:12px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      width:100%;
    }

    .timer{
      margin-top:15px;
      font-weight:bold;
      color:#dc2626;
    }

  </style>
</head>
<body>

<div class="container">

  <h2>Cleaner Dashboard</h2>

  <div class="stats">
    <div class="stat-card">
      Total Leads
      <h3 id="total">0</h3>
    </div>
    <div class="stat-card">
      Verified
      <h3 id="verified">0</h3>
    </div>
    <div class="stat-card">
      Remaining
      <h3 id="remaining">0</h3>
    </div>
  </div>

  <div id="leadSection"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, updateDoc, doc, getDoc } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyA7gt9nQeW6XXADCCoMLaKPWS6Z3YcF-ls",
  authDomain: "rolecrm-dc37a.firebaseapp.com",
  projectId: "rolecrm-dc37a",
  storageBucket: "rolecrm-dc37a.firebasestorage.app",
  messagingSenderId: "273390543342",
  appId: "1:273390543342:web:2d9d677a3b58f15d26aeff",
  measurementId: "G-FE1N5RJ8PK"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentLead = null;
let timerInterval = null;
let seconds = 0;

onAuthStateChanged(auth, async(user)=>{
  if(!user) return location.href="index.html";

  await loadStats(user.uid);
  await loadNextLead(user.uid);
});

async function loadStats(uid){
  const snap = await getDocs(collection(db,"leads"));

  let total=0, verified=0, remaining=0;

  snap.forEach(d=>{
    const data=d.data();
    if(data.assignedCleaner===uid){
      total++;
      if(data.stage==="info") verified++;
      if(data.stage==="verification") remaining++;
    }
  });

  document.getElementById("total").innerText=total;
  document.getElementById("verified").innerText=verified;
  document.getElementById("remaining").innerText=remaining;
}

async function loadNextLead(uid){

  const q=query(
    collection(db,"leads"),
    where("stage","==","verification"),
    where("assignedCleaner","==",uid)
  );

  const snap=await getDocs(q);

  if(snap.empty){
    document.getElementById("leadSection").innerHTML="<h3>No Leads Available</h3>";
    return;
  }

  const docSnap=snap.docs[0];
  currentLead={id:docSnap.id,...docSnap.data()};

  document.getElementById("leadSection").innerHTML=`
    <div class="lead-card">
      <h2>${currentLead.studentName}</h2>
      <p id="phone">${currentLead.phone}</p>
      <button class="copy-btn" onclick="copyNumber()">Copy Number</button>

      <div class="timer" id="timer">00:00</div>

      <select id="status">
        <option value="">Select Status</option>
        <option value="verified">Verified</option>
        <option value="not_receiving">Not Receiving</option>
        <option value="switch_off">Switch Off</option>
        <option value="wrong_number">Wrong Number</option>
      </select>

      <div id="followUpContainer" style="display:none;">
        <input type="datetime-local" id="followUpTime">
      </div>

      <button class="submit-btn" onclick="submitStatus()">Submit</button>
    </div>
  `;
}

window.copyNumber = ()=>{
  navigator.clipboard.writeText(currentLead.phone);
  startTimer();
};

function startTimer(){
  seconds=0;
  if(timerInterval) clearInterval(timerInterval);

  timerInterval=setInterval(()=>{
    seconds++;
    const mins=Math.floor(seconds/60);
    const secs=seconds%60;
    document.getElementById("timer").innerText=
      `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  },1000);
}

window.submitStatus = async ()=>{

  const status=document.getElementById("status").value;
  if(!status) return alert("Select status");

  let updateData={
    updatedAt:new Date(),
    callDuration:seconds
  };

  if(status==="verified"){
    const follow=document.getElementById("followUpTime").value;
    if(!follow) return alert("Select follow-up time");
    updateData.stage="info";
    updateData.followUpTime=new Date(follow);
  } else {
    updateData.stage="closed";
    updateData.status=status;
  }

  await updateDoc(doc(db,"leads",currentLead.id),updateData);

  clearInterval(timerInterval);
  loadNextLead(auth.currentUser.uid);
  loadStats(auth.currentUser.uid);
};

document.addEventListener("change",(e)=>{
  if(e.target.id==="status"){
    if(e.target.value==="verified")
      document.getElementById("followUpContainer").style.display="block";
    else
      document.getElementById("followUpContainer").style.display="none";
  }
});

</script>

</body>
</html>
