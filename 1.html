<!DOCTYPE html>
<html>
<head>
  <title>Verification Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#eef2f7;
    }

    .sidebar{
      width:230px;
      height:100vh;
      position:fixed;
      background:linear-gradient(180deg,#0f172a,#1e3a8a);
      color:white;
      padding:20px;
    }

    .sidebar h2{
      margin-bottom:30px;
    }

    .sidebar p{
      margin:15px 0;
      opacity:0.8;
    }

    .logout-btn{
      background:#ef4444;
      padding:8px;
      border:none;
      border-radius:6px;
      color:white;
      cursor:pointer;
      margin-top:20px;
    }

    .main{
      margin-left:250px;
      padding:20px;
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:15px;
      margin-top:20px;
    }

    .stat-card{
      padding:20px;
      border-radius:12px;
      color:white;
      box-shadow:0 10px 25px rgba(0,0,0,0.15);
    }

    .blue{background:#2563eb;}
    .orange{background:#f97316;}
    .green{background:#16a34a;}
    .red{background:#dc2626;}

    .section{
      margin-top:30px;
    }

    .lead-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:20px;
      margin-top:20px;
    }

    .lead-card{
      background:white;
      padding:15px;
      border-radius:12px;
      box-shadow:0 10px 25px rgba(0,0,0,0.08);
    }

    .lead-card button{
      padding:6px 10px;
      margin:5px 3px 0 0;
      border:none;
      border-radius:6px;
      cursor:pointer;
      font-size:12px;
      color:white;
    }

    .btn-green{background:#22c55e;}
    .btn-red{background:#ef4444;}
    .btn-orange{background:#f97316;}
    .btn-blue{background:#3b82f6;}

    .bottom-grid{
      display:grid;
      grid-template-columns:2fr 1fr;
      gap:20px;
      margin-top:30px;
    }

    canvas{
      background:white;
      padding:15px;
      border-radius:12px;
      box-shadow:0 10px 25px rgba(0,0,0,0.08);
    }

    .reminder{
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0 10px 25px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>

<div class="sidebar">
  <h2>CRM</h2>
  <p>Cleaner Panel</p>
  <p id="userEmail"></p>
  <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="main">

  <div class="header">
    <h2>Verification Dashboard</h2>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card blue">
      Total Leads
      <h2 id="totalCount">0</h2>
    </div>

    <div class="stat-card orange">
      Remaining
      <h2 id="remainingCount">0</h2>
    </div>

    <div class="stat-card green">
      Verified Today
      <h2 id="verifiedToday">0</h2>
    </div>

    <div class="stat-card red">
      Closed Today
      <h2 id="closedToday">0</h2>
    </div>
  </div>

  <!-- Leads -->
  <div class="section">
    <h3>Verification Leads</h3>
    <div class="lead-grid" id="leadContainer"></div>
  </div>

  <!-- Bottom -->
  <div class="bottom-grid">
    <canvas id="chart"></canvas>

    <div class="reminder">
      <h3>Follow-Up Reminders</h3>
      <p>• Call Rahul at 11 AM</p>
      <p>• Follow up with Priya</p>
      <p>• Check Amit tomorrow</p>
    </div>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, updateDoc, doc, getDoc } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyA7gt9nQeW6XXADCCoMLaKPWS6Z3YcF-ls",
  authDomain: "rolecrm-dc37a.firebaseapp.com",
  projectId: "rolecrm-dc37a",
  storageBucket: "rolecrm-dc37a.firebasestorage.app",
  messagingSenderId: "273390543342",
  appId: "1:273390543342:web:2d9d677a3b58f15d26aeff",
  measurementId: "G-FE1N5RJ8PK"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async(user)=>{
  if(!user) location.href="index.html";

  const userSnap = await getDoc(doc(db,"users",user.uid));
  if(!userSnap.exists() || userSnap.data().role !== "cleaner"){
    location.href="index.html";
  }

  document.getElementById("userEmail").innerText=user.email;

  loadLeads();
});

async function loadLeads(){
  const q=query(collection(db,"leads"),where("stage","==","verification"));
  const snap=await getDocs(q);

  let count=0;
  const container=document.getElementById("leadContainer");
  container.innerHTML="";

  snap.forEach(d=>{
    count++;
    const data=d.data();

    container.innerHTML+=`
      <div class="lead-card">
        <b>${data.studentName}</b><br>
        Phone: ${data.phone}<br>
        Status: ${data.status||"New"}<br>

        <button class="btn-green" onclick="updateStage('${d.id}','info')">Verified</button>
        <button class="btn-red" onclick="updateStage('${d.id}','closed')">Wrong</button>
        <button class="btn-orange" onclick="updateStatus('${d.id}','Switch Off')">Switch Off</button>
        <button class="btn-blue">Call Back</button>
      </div>
    `;
  });

  document.getElementById("totalCount").innerText=count;
  document.getElementById("remainingCount").innerText=count;
}

window.updateStage=async(id,stage)=>{
  await updateDoc(doc(db,"leads",id),{
    stage:stage,
    updatedAt:new Date()
  });
  loadLeads();
};

window.updateStatus=async(id,status)=>{
  await updateDoc(doc(db,"leads",id),{
    status:status,
    updatedAt:new Date()
  });
  loadLeads();
};

window.logout=async()=>{
  await signOut(auth);
  location.href="index.html";
};

// Chart Demo
new Chart(document.getElementById("chart"),{
  type:"bar",
  data:{
    labels:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
    datasets:[{
      label:"Calls",
      data:[12,19,8,15,22,18,25],
      backgroundColor:"#2563eb"
    }]
  }
});

</script>

</body>
</html>
